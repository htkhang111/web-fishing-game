{% extends "base.html" %}

{% block content %}
<div class="login-wrapper">
    <div class="login-box">
        <h2>{{ 'Đăng Ký' if register_mode else 'Đăng Nhập' }}</h2>
        <form method="POST" action="{{ url_for('auth.register') if register_mode else url_for('auth.login') }}">
            <div class="input-group">
                <input type="text" name="username" placeholder="Tên đăng nhập" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Mật khẩu" required>
            </div>
            <button type="submit">{{ 'Đăng Ký' if register_mode else 'Đăng Nhập' }}</button>
        </form>
        <div class="switch-link">
            {% if register_mode %}
                <a href="{{ url_for('auth.login') }}">Về đăng nhập</a>
            {% else %}
                <a href="{{ url_for('auth.register') }}">Đăng ký tài khoản mới</a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
